name: Role and restaurant flow integration
on:
  pull_request:
permissions:
  contents: read
jobs:
  role-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-throwaway
          MARIADB_DATABASE: ci_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -pci-only-throwaway"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_DB_HOST: 127.0.0.1
      APP_DB_USER: root
      APP_DB_PASSWORD: ci-only-throwaway
      APP_DB_NAME: ci_test
      APP_DB_STOCK_TRIGGERS: "0"
      APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mysqli, mbstring, fileinfo
      - name: Install database client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
      - name: Upgrade synthetic legacy database and exercise all five roles
        env:
          MYSQL_PWD: ci-only-throwaway
        run: |
          set -euo pipefail
          mariadb -h127.0.0.1 -uroot ci_test < database/tests/infinityfree_legacy_fixture.sql
          mariadb -h127.0.0.1 -uroot ci_test < SQL/upgrade_infinityfree_legacy.sql
          export FLOW_TEST_PASSWORD="$(openssl rand -hex 24)"
          php database/tests/role_flows_seed.php
          php -S 127.0.0.1:8080 -t . >/tmp/role-flow-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/Login.php >/dev/null; then break; fi
            sleep 1
          done
          python3 database/tests/role_flows_http.py
          php database/tests/order_flow.php
